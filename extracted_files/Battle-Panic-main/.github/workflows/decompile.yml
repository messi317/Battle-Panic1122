name: Decompile Flash SWF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download JPEXS FFDEC CLI
        run: |
          wget https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version20.1.0/ffdec_20.1.0.zip
          unzip ffdec_20.1.0.zip -d ffdec

      - name: Export ActionScript Files
        run: |
          mkdir -p output/src
          java -jar ffdec/ffdec.jar -export script output/src battlepanic.swf

      - name: Export to FLA Project
        run: |
          mkdir -p output/fla
          java -jar ffdec/ffdec.jar -export fla output/fla/project.fla battlepanic.swf

      - name: Upload Decompiled Files
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-source
          path: output/
 
